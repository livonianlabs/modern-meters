<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Details</title>
<style>
body { margin: 0; padding: 0; width: 330px; font-family: 'Segoe UI'; font-size: 12px; background-color: #15181d; color: #e8eaed; cursor: default; }
div.classic, div.glass, div.light { padding: 8px 14px 12px 14px; border: 1px solid #3a3f46; }
div.glass { background-color: #0f1a2c; border-color: #3a6fb0; }
div.t { color: #4cc2ff; font-family: 'Segoe UI Semibold', 'Segoe UI'; padding: 8px 0 3px 0; border-bottom: 1px solid #2c3239; margin-bottom: 3px; }
div.glass div.t { border-bottom-color: #1e304a; }
/* Quirks mode: tables don't inherit the body font, and width:100% resolves against the body,
   not the div, so the width is the body's 330 less the div's padding and border */
table { border-collapse: collapse; width: 300px; font-family: 'Segoe UI'; font-size: 12px; color: #e8eaed; }
td { padding: 1px 0; vertical-align: top; }
td.k { color: #9aa3ad; white-space: nowrap; padding-right: 12px; }
td.v { text-align: right; word-break: break-all; }
div.light, div.light table { color: #1d232b; }
div.light { border-color: #8a94a1; }
div.light div.t { color: #0a7fd0; border-bottom-color: #e1e6eb; }
div.light td.k { color: #5d6773; }
</style>
<script type="text/javascript">
// Content comes from the gadget (toggleDetails in common.js), which calls render() again to
// update an open flyout
function init() {
    var html = "";
    try { html = System.Gadget.document.parentWindow.flyoutHtml; } catch (e) { }
    render(html);
}

function render(html) {
    document.getElementById("content").innerHTML = html;
    var bg = /background-color:(#[0-9a-f]{6})/i.exec(html);
    document.body.style.backgroundColor = bg ? bg[1] : "#15181d";
    document.body.style.height = document.body.scrollHeight + "px";
}
</script>
</head>
<body onload="init()">
<div id="content"></div>
</body>
</html>
